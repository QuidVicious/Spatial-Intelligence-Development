<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium Ground Truth Generator</title>

  <!-- 1. CDN Base URL -->
  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/';
  </script>

  <!-- 2. CesiumJS Library & Styles -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
    }
    #cesiumContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.88);
      padding: 12px;
      border-radius: 6px;
      font-family: sans-serif;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 15px;
      background: #008CBA;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
    }
    button:hover { background: #005f73; }
    button.export-btn { background: #28a745; text-align: center; }
    button.export-btn:hover { background: #1e7e34; }
    .status-badge {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="status-badge" id="modeStatus">Mode: Photogrammetry (RGB)</div>
    <button onclick="setMode('rgb')">1. View RGB Photogrammetry</button>
    <button onclick="setMode('depth')">2. View Linear Depth Map</button>
    <button onclick="setMode('clay')">3. View Shaded Clay Model</button>
    <button onclick="setMode('normal')">4. View Surface Normal Map</button>
    <hr style="border: 0.5px solid #444; width: 100%;">
    <button class="export-btn" onclick="captureGroundTruth()">Export 4-Pass Payload</button>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // PASTE YOUR CESIUM ION TOKEN HERE
    const ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjNjcxOTJmOS1iZDBkLTQ4ZWItYjQ0NS0zOTcwMmYzZTc0MDEiLCJpZCI6NDMwMjE4LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzg1MjQwNzV9.U_YLDGJUhSgkfiX87Gn5nRSXyhTCY9Janak2RNgYhSs';
    Cesium.Ion.defaultAccessToken = ION_TOKEN;

    // 1. Initialize Viewer
    const viewer = new Cesium.Viewer('cesiumContainer', {
      contextOptions: {
        webgl: { preserveDrawingBuffer: true }
      },
      animation: false,
      timeline: false
    });

    // Disable OIT to prevent framebuffer resolve crashes
    viewer.scene.orderIndependentTranslucency = false;

    let googleTileset = null;
    let currentMode = 'rgb';

    // 2. Define GPU Linear Grayscale Depth Shader
    const depthShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      translucencyMode: Cesium.CustomShaderTranslucencyMode.OPAQUE,
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          float eyeDepth = -fsInput.attributes.positionEC.z;
          float nearDist = 5.0;
          float farDist = 800.0;
          float normalizedDepth = clamp((eyeDepth - nearDist) / (farDist - nearDist), 0.0, 1.0);
          float invDepth = 1.0 - normalizedDepth;
          material.diffuse = vec3(invDepth);
          material.alpha = 1.0;
        }
      `
    });

    // 3. Define Surface Normal Shader (Calculates exact surface angles on-the-fly via Derivatives)
    const normalShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      translucencyMode: Cesium.CustomShaderTranslucencyMode.OPAQUE,
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          vec3 posEC = fsInput.attributes.positionEC;

          // Compute surface tangent vectors from screen-space position derivatives
          vec3 dx = dFdx(posEC);
          vec3 dy = dFdy(posEC);

          // Compute exact face normal vector via cross product
          vec3 normalEC = normalize(cross(dx, dy));

          // Remap normal vector [-1.0, 1.0] into [0.0, 1.0] RGB color space
          vec3 normalColor = normalEC * 0.5 + 0.5;

          material.diffuse = normalColor;
          material.alpha = 1.0;
        }
      `
    });
    
    // 4. Load Google Photorealistic 3D Tiles
    async function loadGoogle3DTiles() {
      try {
        if (typeof Cesium.createGooglePhotorealistic3DTileset === 'function') {
          googleTileset = await Cesium.createGooglePhotorealistic3DTileset();
        } else {
          googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275204);
        }

        viewer.scene.primitives.add(googleTileset);

        // Fly camera default to SF view
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(-122.401, 37.789, 250),
          orientation: {
            heading: Cesium.Math.toRadians(45.0),
            pitch: Cesium.Math.toRadians(-20.0),
            roll: 0.0
          }
        });
        console.log("Google Photorealistic 3D Tiles loaded successfully!");
      } catch (error) {
        console.error("Error loading Google 3D Tiles:", error);
      }
    }

    loadGoogle3DTiles();

    // 5. Mode Switcher Engine
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeStatus').innerText = `Mode: ${mode.toUpperCase()}`;

      if (!googleTileset) return;

      // Reset tile custom shaders and style defaults
      googleTileset.customShader = undefined;
      googleTileset.style = undefined;
      googleTileset.colorBlendMode = Cesium.Cesium3DTileColorBlendMode.HIGHLIGHT;

      if (mode === 'depth') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;

        googleTileset.customShader = depthShader;
      } 
      else if (mode === 'normal') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;

        googleTileset.customShader = normalShader;
      }
      else if (mode === 'clay') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#111111');
        
        viewer.shadows = true;
        googleTileset.shadows = Cesium.ShadowMode.ENABLED;

        googleTileset.colorBlendMode = Cesium.Cesium3DTileColorBlendMode.MIX;
        googleTileset.colorBlendAmount = 0.88;
        googleTileset.style = new Cesium.Cesium3DTileStyle({
          color: "color('#dddddd')"
        });
      }
      else if (mode === 'rgb') {
        viewer.scene.fog.enabled = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
      }

      viewer.render();
    }

    // 6. Export 4-Pass Payload
    async function captureGroundTruth() {
      console.log("Exporting 4-pass ground truth payload...");

      try {
        const camera = viewer.camera;
        const cartographic = camera.positionCartographic;

        const metadata = {
          geographic_location: {
            latitude: Cesium.Math.toDegrees(cartographic.latitude),
            longitude: Cesium.Math.toDegrees(cartographic.longitude),
            altitude_meters: cartographic.height
          },
          camera_transform: {
            heading_deg: Cesium.Math.toDegrees(camera.heading),
            pitch_deg: Cesium.Math.toDegrees(camera.pitch),
            roll_deg: Cesium.Math.toDegrees(camera.roll)
          },
          environment: {
            datetime_iso: Cesium.JulianDate.toIso8601(viewer.clock.currentTime)
          }
        };

        const originalMode = currentMode;

        // Pass 1: RGB Photogrammetry
        setMode('rgb');
        viewer.render();
        const rgbImage = viewer.canvas.toDataURL('image/png');

        // Pass 2: Linear Depth Map
        setMode('depth');
        viewer.render();
        const depthImage = viewer.canvas.toDataURL('image/png');

        // Pass 3: Shaded Clay Model
        setMode('clay');
        viewer.render();
        const clayImage = viewer.canvas.toDataURL('image/png');

        // Pass 4: Surface Normal Map
        setMode('normal');
        viewer.render();
        const normalImage = viewer.canvas.toDataURL('image/png');

        // Restore original user view
        setMode(originalMode);

        const payload = {
          metadata: metadata,
          rgb_image: rgbImage,
          depth_image: depthImage,
          clay_image: clayImage,
          normal_image: normalImage
        };

        // Download JSON Payload
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `ground_truth_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);

        alert("Success! Exported 4-Pass Payload (RGB + Depth + Clay + Surface Normals).");

      } catch (err) {
        console.error("Export Error:", err);
        alert("Export Failed: " + err.message);
      }
    }
  </script>
</body>
</html>
