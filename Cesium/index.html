<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium Ground Truth Generator - Domain Key Edition</title>

  <!-- 1. CDN Base URL -->
  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/';
  </script>

  <!-- 2. CesiumJS Library & Styles -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
    }
    #cesiumContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.88);
      padding: 12px;
      border-radius: 6px;
      font-family: sans-serif;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 250px;
      max-height: 94vh;
      overflow-y: auto;
    }
    button {
      padding: 8px 10px;
      background: #008CBA;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 11px;
    }
    button:hover { background: #005f73; }
    button.export-btn { background: #28a745; text-align: center; margin-top: 4px; font-size: 12px; }
    button.export-btn:hover { background: #1e7e34; }
    .status-badge {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 2px;
    }
    .section-header {
      font-size: 11px;
      font-weight: bold;
      color: #00bcd4;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    label {
      font-size: 10px;
      color: #aaa;
      margin-top: 1px;
    }
    input[type="text"], select {
      padding: 5px 7px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="status-badge" id="modeStatus">Mode: Photogrammetry (RGB)</div>
    <button onclick="setMode('rgb')">1. View RGB Photogrammetry</button>
    <button onclick="setMode('depth')">2. View Dynamic Depth Map</button>
    <button onclick="setMode('clay')">3. View Shaded Clay Model</button>
    <button onclick="setMode('normal')">4. View Surface Normal Map</button>
    <button onclick="setMode('edges')">5. View Clean LineArt Edges</button>

    <div class="section-header">Solar & Atmosphere</div>
    <label for="timeInput">Time of Day (Sun Control):</label>
    <select id="timeInput" onchange="updateSunTime()">
      <option value="auto">Auto (Live GIS Solar Time)</option>
      <option value="sunset">Sunset / Gloaming</option>
      <option value="golden">Golden Hour</option>
      <option value="noon">Midday / Clear Sun</option>
      <option value="twilight">Night / Twilight</option>
    </select>
    
    <label for="weatherInput">Weather Conditions:</label>
    <input type="text" id="weatherInput" placeholder="Auto (Live GIS Weather)...">

    <div class="section-header">Domain Key Prompting Lenses</div>
    <label for="geologyInput">1. Geology & Lithology Lens:</label>
    <input type="text" id="geologyInput" placeholder="Auto (e.g., Old Red Sandstone, Granite)...">

    <label for="eraStyleInput">2. Architecture & Era Lens:</label>
    <input type="text" id="eraStyleInput" placeholder="Auto (e.g., Victorian Masonry, Gothic)...">

    <label for="weatheringInput">3. Material Patina & Erosion Lens:</label>
    <input type="text" id="weatheringInput" placeholder="Auto (e.g., Moss staining, Salt patina)...">

    <hr style="border: 0.5px solid #444; width: 100%; margin: 4px 0;">
    <button class="export-btn" onclick="captureGroundTruth()">Export 5-Pass Payload</button>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    let googleTileset = null;
    let currentMode = 'rgb';
    let viewer = null;

// 1. Upgraded Shaders (Gamma Depth, Smooth Normals, Ink LineArt)
    const depthShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      translucencyMode: Cesium.CustomShaderTranslucencyMode.OPAQUE,
      uniforms: {
        u_nearDist: {
          type: Cesium.UniformType.FLOAT,
          value: 2.0
        },
        u_farDist: {
          type: Cesium.UniformType.FLOAT,
          value: 800.0
        }
      },
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          float eyeDepth = -fsInput.attributes.positionEC.z;
          float normalizedDepth = clamp((eyeDepth - u_nearDist) / (u_farDist - u_nearDist), 0.0, 1.0);
          
          // Gamma curve compression (0.55 power) expands midground grayscale contrast over 0.5 mile range
          float curvedDepth = pow(normalizedDepth, 0.55);
          float invDepth = 1.0 - curvedDepth;
          
          material.diffuse = vec3(invDepth);
          material.alpha = 1.0;
        }
      `
    });

    const normalShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      translucencyMode: Cesium.CustomShaderTranslucencyMode.OPAQUE,
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          vec3 posEC = fsInput.attributes.positionEC;
          vec3 dx = dFdx(posEC);
          vec3 dy = dFdy(posEC);
          vec3 rawNormalEC = normalize(cross(dx, dy));

          // Screen-space normal alignment & micro-jitter filter
          vec3 absN = abs(rawNormalEC);
          float maxComp = max(absN.x, max(absN.y, absN.z));
          vec3 dominantAxis = sign(rawNormalEC) * step(vec3(maxComp), absN);
          
          // Softly blend raw normals towards dominant orientation planes to clean sub-triangle noise
          vec3 smoothedNormal = normalize(mix(rawNormalEC, dominantAxis, 0.35));

          vec3 normalColor = smoothedNormal * 0.5 + 0.5;
          material.diffuse = normalColor;
          material.alpha = 1.0;
        }
      `
    });

    const lineArtShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      translucencyMode: Cesium.CustomShaderTranslucencyMode.OPAQUE,
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          vec3 posEC = fsInput.attributes.positionEC;
          float eyeDepth = -posEC.z;

          // Distance-normalized depth gradient (silhouette edges)
          float dxDepth = dFdx(eyeDepth);
          float dyDepth = dFdy(eyeDepth);
          float depthGrad = length(vec2(dxDepth, dyDepth)) / max(1.0, eyeDepth * 0.025);

          // Normal vector gradient (crease edges)
          vec3 dx = dFdx(posEC);
          vec3 dy = dFdy(posEC);
          vec3 normalEC = normalize(cross(dx, dy));
          float normalGrad = length(dFdx(normalEC)) + length(dFdy(normalEC));

          // Noise thresholding filters out photogrammetry micro-facets
          float depthEdge = smoothstep(0.15, 0.50, depthGrad);
          float normalEdge = smoothstep(1.8, 3.8, normalGrad);

          float edgeSignal = clamp(depthEdge + normalEdge * 0.5, 0.0, 1.0);

          // Render clean black architectural lines on a white canvas
          material.diffuse = vec3(1.0 - edgeSignal);
          material.alpha = 1.0;
        }
      `
    });

    // 2. Dynamic Depth Uniform Bounds (0.5 Mile Range Calibration)
    function updateDepthUniforms() {
      if (!viewer) return;
      const cameraAlt = viewer.camera.positionCartographic.height;
      const nearBound = Math.max(1.0, cameraAlt * 0.05);
      // Calibrated range up to 0.5 miles (800m+)
      const farBound = Math.max(200.0, cameraAlt * 4.0 + 800.0);
      depthShader.setUniform('u_nearDist', nearBound);
      depthShader.setUniform('u_farDist', farBound);
    }

    // 3. Sun Position Controller
    function updateSunTime() {
      if (!viewer) return;
      const choice = document.getElementById('timeInput').value;
      const now = new Date();

      if (choice === 'sunset') {
        now.setUTCHours(19, 30, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(now);
      } else if (choice === 'golden') {
        now.setUTCHours(18, 0, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(now);
      } else if (choice === 'noon') {
        now.setUTCHours(12, 0, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(now);
      } else if (choice === 'twilight') {
        now.setUTCHours(21, 0, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(now);
      } else if (choice === 'auto') {
        viewer.clock.currentTime = Cesium.JulianDate.now();
      }
      viewer.render();
    }

    // 4. Load Google 3D Tiles
    async function loadGoogle3DTiles() {
      try {
        if (typeof Cesium.createGooglePhotorealistic3DTileset === 'function') {
          googleTileset = await Cesium.createGooglePhotorealistic3DTileset();
        } else {
          googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275204);
        }

        if (viewer) {
          viewer.scene.primitives.add(googleTileset);
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(-122.401, 37.789, 250),
            orientation: {
              heading: Cesium.Math.toRadians(45.0),
              pitch: Cesium.Math.toRadians(-20.0),
              roll: 0.0
            }
          });
        }
        console.log("Google Photorealistic 3D Tiles loaded successfully!");
      } catch (error) {
        console.error("Error loading Google 3D Tiles:", error);
      }
    }

    // 5. Mode Switcher
    function setMode(mode) {
      if (!viewer || !googleTileset) return;
      currentMode = mode;
      document.getElementById('modeStatus').innerText = `Mode: ${mode.toUpperCase()}`;

      googleTileset.customShader = undefined;
      googleTileset.style = undefined;
      googleTileset.colorBlendMode = Cesium.Cesium3DTileColorBlendMode.HIGHLIGHT;

      if (mode === 'depth') {
        updateDepthUniforms();
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
        googleTileset.customShader = depthShader;
      } 
      else if (mode === 'normal') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
        googleTileset.customShader = normalShader;
      }
      else if (mode === 'edges') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
        googleTileset.customShader = lineArtShader;
      }
      else if (mode === 'clay') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#181818');
        viewer.shadows = true;
        googleTileset.shadows = Cesium.ShadowMode.ENABLED;

        googleTileset.colorBlendMode = Cesium.Cesium3DTileColorBlendMode.MIX;
        googleTileset.colorBlendAmount = 0.94;
        googleTileset.style = new Cesium.Cesium3DTileStyle({
          color: "color('#e0e0e0')"
        });
      }
      else if (mode === 'rgb') {
        viewer.scene.fog.enabled = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
      }

      viewer.render();
    }

    // 6. Synchronized Render Wait
    function waitForRender() {
      return new Promise((resolve) => {
        const removeListener = viewer.scene.postRender.addEventListener(() => {
          removeListener();
          resolve();
        });
        viewer.render();
      });
    }

    // 7. Ground Truth Export
    async function captureGroundTruth() {
      if (!viewer) return;
      console.log("Exporting 5-pass ground truth payload with domain keys...");

      try {
        const camera = viewer.camera;
        const cartographic = camera.positionCartographic;

        const timeChoice = document.getElementById('timeInput').value;
        const userWeather = document.getElementById('weatherInput').value.trim();
        const userGeology = document.getElementById('geologyInput').value.trim();
        const userEraStyle = document.getElementById('eraStyleInput').value.trim();
        const userWeathering = document.getElementById('weatheringInput').value.trim();

        const metadata = {
          geographic_location: {
            latitude: Cesium.Math.toDegrees(cartographic.latitude),
            longitude: Cesium.Math.toDegrees(cartographic.longitude),
            altitude_meters: cartographic.height
          },
          camera_transform: {
            heading_deg: Cesium.Math.toDegrees(camera.heading),
            pitch_deg: Cesium.Math.toDegrees(camera.pitch),
            roll_deg: Cesium.Math.toDegrees(camera.roll)
          },
          environment: {
            datetime_iso: Cesium.JulianDate.toIso8601(viewer.clock.currentTime),
            time_of_day_setting: timeChoice,
            weather_setting: userWeather
          },
          domain_keys: {
            geology_lithology: userGeology,
            era_architecture_style: userEraStyle,
            weathering_patina: userWeathering
          }
        };

        const originalMode = currentMode;

        setMode('rgb');
        await waitForRender();
        const rgbImage = viewer.canvas.toDataURL('image/png');

        setMode('depth');
        await waitForRender();
        const depthImage = viewer.canvas.toDataURL('image/png');

        setMode('clay');
        await waitForRender();
        const clayImage = viewer.canvas.toDataURL('image/png');

        setMode('normal');
        await waitForRender();
        const normalImage = viewer.canvas.toDataURL('image/png');

        setMode('edges');
        await waitForRender();
        const edgeImage = viewer.canvas.toDataURL('image/png');

        setMode(originalMode);

        const payload = {
          metadata: metadata,
          rgb_image: rgbImage,
          depth_image: depthImage,
          clay_image: clayImage,
          normal_image: normalImage,
          edge_image: edgeImage
        };

        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `ground_truth_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);

        alert("Success! Exported 5-Pass Payload with Domain Keys.");

      } catch (err) {
        console.error("Export Error:", err);
        alert("Export Failed: " + err.message);
      }
    }

    // 8. Application Initialization
    async function initApp() {
      try {
        const response = await fetch('.env');
        const text = await response.text();
        const match = text.match(/CESIUM_ION_TOKEN\s*=\s*["']?([^"'\r\n]+)["']?/);
        if (match && match[1]) {
          Cesium.Ion.defaultAccessToken = match[1].trim();
        }
      } catch (err) {
        console.warn("Could not load .env file:", err);
      }

      viewer = new Cesium.Viewer('cesiumContainer', {
        contextOptions: {
          webgl: { preserveDrawingBuffer: true }
        },
        animation: false,
        timeline: false
      });

      viewer.scene.orderIndependentTranslucency = false;

      loadGoogle3DTiles();
    }

    initApp();
  </script>
</body>
</html>
