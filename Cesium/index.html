<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium Ground Truth Generator - Spatial Intelligence Edition</title>

  <!-- 1. CDN Base URL -->
  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/';
  </script>

  <!-- 2. CesiumJS Library & Styles -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
    }
    #cesiumContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.88);
      padding: 12px;
      border-radius: 6px;
      font-family: sans-serif;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 280px;
      max-height: 94vh;
      overflow-y: auto;
    }
    button {
      padding: 7px 10px;
      background: #008CBA;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 11px;
    }
    button:hover { background: #005f73; }
    button.export-btn { background: #28a745; text-align: center; margin-top: 6px; font-size: 12px; }
    button.export-btn:hover { background: #1e7e34; }
    .status-badge {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 2px;
    }
    .section-header {
      font-size: 11px;
      font-weight: bold;
      color: #00bcd4;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    label {
      font-size: 10px;
      color: #aaa;
      margin-top: 2px;
    }
    input[type="text"], select {
      padding: 5px 7px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 11px;
    }
    input[type="range"] {
      width: 100%;
      margin: 2px 0 4px 0;
      accent-color: #00bcd4;
      cursor: pointer;
    }
    .val-badge {
      color: #00bcd4;
      float: right;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="status-badge" id="modeStatus">Mode: Photogrammetry (RGB)</div>
    <button onclick="setMode('rgb')">1. View RGB Photogrammetry</button>
    <button onclick="setMode('depth')">2. View Dynamic Depth Map</button>

    <div class="section-header">Depth Shader Controls</div>
    <label for="depthSmoothingSlider">Noise Suppression: <span class="val-badge" id="v_smooth">0.40</span></label>
    <input type="range" id="depthSmoothingSlider" min="0.0" max="1.0" step="0.05" value="0.4" oninput="updateShaderUniforms()">

    <label for="depthPowerSlider">Focus Falloff: <span class="val-badge" id="v_power">0.08</span></label>
    <input type="range" id="depthPowerSlider" min="0.01" max="0.80" step="0.01" value="0.08" oninput="updateShaderUniforms()">

    <div class="section-header">AI Pipeline Controls</div>
    <label for="pass1_temp">Pass 1 Temp (Spatial Lock): <span class="val-badge" id="v_p1_t">0.20</span></label>
    <input type="range" id="pass1_temp" min="0.05" max="0.50" step="0.05" value="0.20" oninput="document.getElementById('v_p1_t').innerText=this.value">

    <label for="pass1_top_p">Pass 1 Top P: <span class="val-badge" id="v_p1_p">0.25</span></label>
    <input type="range" id="pass1_top_p" min="0.05" max="0.80" step="0.05" value="0.25" oninput="document.getElementById('v_p1_p').innerText=this.value">

    <label for="pass2_temp">Pass 2 Temp (Refinement): <span class="val-badge" id="v_p2_t">0.25</span></label>
    <input type="range" id="pass2_temp" min="0.05" max="0.60" step="0.05" value="0.25" oninput="document.getElementById('v_p2_t').innerText=this.value">

    <label for="pass2_top_p">Pass 2 Top P: <span class="val-badge" id="v_p2_p">0.45</span></label>
    <input type="range" id="pass2_top_p" min="0.10" max="0.95" step="0.05" value="0.45" oninput="document.getElementById('v_p2_p').innerText=this.value">

    <label for="thinkingLevel">Thinking Level:</label>
    <select id="thinkingLevel">
      <option value="HIGH" selected>HIGH (Strict Boundary Lock)</option>
      <option value="LOW">LOW (Fast)</option>
    </select>

    <div class="section-header">Solar & Atmosphere</div>
    <label for="timeInput">Time of Day:</label>
    <select id="timeInput" onchange="updateSunTime()">
      <option value="auto">Auto (Live GIS Solar Time)</option>
      <option value="sunset">Sunset / Gloaming</option>
      <option value="golden">Golden Hour</option>
      <option value="noon">Midday / Clear Sun</option>
      <option value="twilight">Night / Twilight</option>
    </select>
    
    <label for="weatherInput">Weather Override:</label>
    <input type="text" id="weatherInput" placeholder="Auto (Live GIS Weather)...">

    <div class="section-header">Domain Key Lenses (Optional)</div>
    <label for="geologyInput">1. Lithology & Stone:</label>
    <input type="text" id="geologyInput" placeholder="Auto-resolved via GIS...">

    <label for="eraStyleInput">2. Architecture Style:</label>
    <input type="text" id="eraStyleInput" placeholder="Auto-resolved via GIS...">

    <label for="weatheringInput">3. Patina & Weathering:</label>
    <input type="text" id="weatheringInput" placeholder="Auto-resolved via GIS...">

    <hr style="border: 0.5px solid #444; width: 100%; margin: 6px 0;">
    <button class="export-btn" onclick="captureGroundTruth()">Export 2-Pass Payload</button>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    let googleTileset = null;
    let currentMode = 'rgb';
    let viewer = null;

    // Depth Shader with Screen-Space Noise Filter
    const depthShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      translucencyMode: Cesium.CustomShaderTranslucencyMode.OPAQUE,
      uniforms: {
        u_nearDist: { type: Cesium.UniformType.FLOAT, value: 1.0 },
        u_farDist: { type: Cesium.UniformType.FLOAT, value: 2000.0 },
        u_depthPower: { type: Cesium.UniformType.FLOAT, value: 0.08 },
        u_depthSmoothing: { type: Cesium.UniformType.FLOAT, value: 0.4 }
      },
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          float rawEyeDepth = -fsInput.attributes.positionEC.z;
          
          float dxDepth = dFdx(rawEyeDepth);
          float dyDepth = dFdy(rawEyeDepth);
          float depthGrad = length(vec2(dxDepth, dyDepth));
          
          float smoothWeight = smoothstep(0.0, 2.0 * u_depthSmoothing, depthGrad);
          float filteredEyeDepth = mix(rawEyeDepth, rawEyeDepth - (depthGrad * 0.1 * u_depthSmoothing), smoothWeight);

          float normalizedDepth = clamp((filteredEyeDepth - u_nearDist) / (u_farDist - u_nearDist), 0.0, 1.0);
          float curvedDepth = pow(normalizedDepth, u_depthPower);
          float invDepth = 1.0 - curvedDepth;
          
          material.diffuse = vec3(invDepth);
          material.alpha = 1.0;
        }
      `
    });

    function updateShaderUniforms() {
      if (!viewer) return;

      const depthVal = parseFloat(document.getElementById('depthPowerSlider').value);
      const smoothVal = parseFloat(document.getElementById('depthSmoothingSlider').value);

      document.getElementById('v_power').innerText = depthVal.toFixed(2);
      document.getElementById('v_smooth').innerText = smoothVal.toFixed(2);

      depthShader.setUniform('u_depthPower', depthVal);
      depthShader.setUniform('u_depthSmoothing', smoothVal);

      const cameraAlt = viewer.camera.positionCartographic.height;
      const nearBound = Math.max(1.0, cameraAlt * 0.05);
      const farBound = Math.max(200.0, cameraAlt * 4.0 + 800.0);
      depthShader.setUniform('u_nearDist', nearBound);
      depthShader.setUniform('u_farDist', farBound);

      viewer.render();
    }

    function updateSunTime() {
      if (!viewer) return;
      const choice = document.getElementById('timeInput').value;
      const now = new Date();

      if (choice === 'sunset') now.setUTCHours(19, 30, 0);
      else if (choice === 'golden') now.setUTCHours(18, 0, 0);
      else if (choice === 'noon') now.setUTCHours(12, 0, 0);
      else if (choice === 'twilight') now.setUTCHours(21, 0, 0);
      else if (choice === 'auto') now = new Date();

      viewer.clock.currentTime = Cesium.JulianDate.fromDate(now);
      viewer.render();
    }

    async function loadGoogle3DTiles() {
      try {
        if (typeof Cesium.createGooglePhotorealistic3DTileset === 'function') {
          googleTileset = await Cesium.createGooglePhotorealistic3DTileset();
        } else {
          googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275204);
        }

        if (viewer) {
          viewer.scene.primitives.add(googleTileset);
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(-122.401, 37.789, 250),
            orientation: {
              heading: Cesium.Math.toRadians(45.0),
              pitch: Cesium.Math.toRadians(-20.0),
              roll: 0.0
            }
          });
        }
      } catch (error) {
        console.error("Error loading Google 3D Tiles:", error);
      }
    }

    function setMode(mode) {
      if (!viewer || !googleTileset) return;
      currentMode = mode;
      document.getElementById('modeStatus').innerText = `Mode: ${mode.toUpperCase()}`;

      googleTileset.customShader = undefined;
      googleTileset.style = undefined;
      googleTileset.colorBlendMode = Cesium.Cesium3DTileColorBlendMode.HIGHLIGHT;

      updateShaderUniforms();

      if (mode === 'depth') {
        viewer.scene.fog.enabled = false;
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
        googleTileset.customShader = depthShader;
      } else if (mode === 'rgb') {
        viewer.scene.fog.enabled = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.shadows = false;
        googleTileset.shadows = Cesium.ShadowMode.DISABLED;
      }

      viewer.render();
    }

    function waitForRender() {
      return new Promise((resolve) => {
        const removeListener = viewer.scene.postRender.addEventListener(() => {
          removeListener();
          resolve();
        });
        viewer.render();
      });
    }

    async function captureGroundTruth() {
      if (!viewer) return;

      try {
        const camera = viewer.camera;
        const cartographic = camera.positionCartographic;

        const timeChoice = document.getElementById('timeInput').value;
        const userWeather = document.getElementById('weatherInput').value.trim();
        const userGeology = document.getElementById('geologyInput').value.trim();
        const userEraStyle = document.getElementById('eraStyleInput').value.trim();
        const userWeathering = document.getElementById('weatheringInput').value.trim();

        const metadata = {
          geographic_location: {
            latitude: Cesium.Math.toDegrees(cartographic.latitude),
            longitude: Cesium.Math.toDegrees(cartographic.longitude),
            altitude_meters: cartographic.height
          },
          camera_transform: {
            heading_deg: Cesium.Math.toDegrees(camera.heading),
            pitch_deg: Cesium.Math.toDegrees(camera.pitch),
            roll_deg: Cesium.Math.toDegrees(camera.roll)
          },
          environment: {
            datetime_iso: Cesium.JulianDate.toIso8601(viewer.clock.currentTime),
            time_of_day_setting: timeChoice,
            weather_setting: userWeather
          },
          domain_keys: {
            geology_lithology: userGeology,
            era_architecture_style: userEraStyle,
            weathering_patina: userWeathering
          }
        };

        const pipeline_parameters = {
          pass1_temperature: parseFloat(document.getElementById('pass1_temp').value),
          pass1_top_p: parseFloat(document.getElementById('pass1_top_p').value),
          pass2_temperature: parseFloat(document.getElementById('pass2_temp').value),
          pass2_top_p: parseFloat(document.getElementById('pass2_top_p').value),
          thinking_level: document.getElementById('thinkingLevel').value
        };

        const originalMode = currentMode;

        setMode('rgb');
        await waitForRender();
        const rgbImage = viewer.canvas.toDataURL('image/png');

        setMode('depth');
        await waitForRender();
        const depthImage = viewer.canvas.toDataURL('image/png');

        setMode(originalMode);

        const payload = {
          metadata: metadata,
          pipeline_parameters: pipeline_parameters,
          rgb_image: rgbImage,
          depth_image: depthImage
        };

        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `ground_truth_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);

      } catch (err) {
        console.error("Export Error:", err);
        alert("Export Failed: " + err.message);
      }
    }

    async function initApp() {
      try {
        const response = await fetch('.env');
        const text = await response.text();
        const match = text.match(/CESIUM_ION_TOKEN\s*=\s*["']?([^"'\r\n]+)["']?/);
        if (match && match[1]) {
          Cesium.Ion.defaultAccessToken = match[1].trim();
        }
      } catch (err) {
        console.warn("Could not load .env file:", err);
      }

      viewer = new Cesium.Viewer('cesiumContainer', {
        contextOptions: { webgl: { preserveDrawingBuffer: true } },
        animation: false,
        timeline: false
      });

      viewer.scene.orderIndependentTranslucency = false;
      loadGoogle3DTiles();
    }

    initApp();
  </script>
</body>
</html>
